name: EVO Semantic Runtime CI

on:
  push:
    branches:
      - evo-semantic-runtime
    paths:
      - "modules/evo/**"
      - "tests/test_evo_*.py"
      - "requirements.txt"
      - ".github/workflows/evo-ci.yml"
  pull_request:
    paths:
      - "modules/evo/**"
      - "tests/test_evo_*.py"
      - "requirements.txt"
      - ".github/workflows/evo-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-runtime:
    name: semantic-runtime (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile EVO runtime
        run: python -m compileall -q modules/evo

      - name: Run EVO semantic tests
        run: python -m pytest -q tests/test_evo_*.py
